name: Build & Test Helium

on:
  workflow_dispatch:
  push:
    branches:
      - 26.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-ci.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload CI build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helium-${{ github.ref_name }}-ci-log
          path: build-ci.log
          retention-days: 7

      - name: Upload Mod Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: helium-${{ github.ref_name }}-build
          path: build/libs/*.jar
          retention-days: 7
